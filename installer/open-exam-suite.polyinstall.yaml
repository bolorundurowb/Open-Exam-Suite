# yaml-language-server: $schema=https://bolorundurowb.github.io/PolyInstall/schema/v1.json
#
# Parity notes:
# - This manifest intentionally matches a "full" install (Simulator + Creator + Samples).
#   PolyInstall features can model optional components later if we want a custom install flow.
# - Build with repo root as --base, e.g.:
#     polyinstall build installer/open-exam-suite.polyinstall.yaml --base .
#
metadata:
  name: Open Exam Suite
  version: "${APP_VERSION:-0.0.0}"
  id: B4C7E2F1-8A3D-4B9E-9C2D-1E5F6A7B8C90
  publisher: Winner-Timothy Bolorunduro
build:
  output_dir: installer/Output
  output_name: OpenExamSuite-{version}-Setup-x64
  compression: brotli
  targets:
    - windows-x64
  windows:
    install_scope: machine
    register_arp: true
ui:
  theme: system
  wizard_steps:
    - type: welcome
      title: Welcome
    - type: eula
      title: License agreement
      source: LICENSE
    - type: destination
      title: Install location
      default_path: "{ProgramFiles}/Open Exam Suite"
    - type: progress
      title: Installing
    - type: finish
      title: Complete
files:
  # Staging layout matches Inno [Files] (paths relative to Open-Exam-Suite repo root).
  - source_dir: build/installer/staging
    include:
      - "Simulator/**/*"
      - "Creator/**/*"
      - "Samples/**/*"
  - source_dir: .
    include:
      - LICENSE
file_associations:
  - extension: .oef
    description: Open Exam Suite Exam
    prog_id: OpenExamSuite.oef
    icon: "Simulator/OpenExamSuite.Simulator.exe,0"
    command: '"{AppDir}/Simulator/OpenExamSuite.Simulator.exe" "%1"'
tasks:
  post_install:
    - require: os.isWindows
      action: create_shortcut
      parameters:
        target_path: "{AppDir}/Creator/OpenExamSuite.Creator.exe"
        name: Creator
        location: start_menu
        subfolder: Open Exam Suite
        description: Open Exam Suite Creator
        icon_path: "{AppDir}/Creator/OpenExamSuite.Creator.exe"
    - require: os.isWindows
      action: create_shortcut
      parameters:
        target_path: "{AppDir}/Creator/OpenExamSuite.Creator.exe"
        name: Open Exam Suite Creator
        location: desktop
        description: Open Exam Suite Creator
        icon_path: "{AppDir}/Creator/OpenExamSuite.Creator.exe"
    - require: os.isWindows
      action: create_shortcut
      parameters:
        target_path: "{AppDir}/Simulator/OpenExamSuite.Simulator.exe"
        name: Simulator.lnk
        location: start_menu
        subfolder: Open Exam Suite
        description: Open Exam Suite Simulator
        icon_path: "{AppDir}/Simulator/OpenExamSuite.Simulator.exe"
    - require: os.isWindows
      action: create_shortcut
      parameters:
        target_path: "{AppDir}/Simulator/OpenExamSuite.Simulator.exe"
        name: Simulator
        location: desktop
        description: Open Exam Suite Simulator
        icon_path: "{AppDir}/Simulator/OpenExamSuite.Simulator.exe"
