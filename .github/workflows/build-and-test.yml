name: Build, Test & Coverage

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./src

    - name: Build all projects
      run: dotnet build --configuration Release --no-restore
      working-directory: ./src

    - name: Run tests with code coverage
      run: dotnet test --configuration Release --no-build /p:CollectCoverage=true
      working-directory: ./src

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage/
        fail_ci_if_error: false

  build-and-test-unix:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Install Avalonia native libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1 libx11-6 libice6 libsm6

    - name: Restore portable projects
      run: |
        dotnet restore Tests/Core.Tests/Core.Tests.csproj
        dotnet restore Tests/Shared.Tests/Shared.Tests.csproj
        dotnet restore Tests/Storage.Tests/Storage.Tests.csproj
        dotnet restore Tests/Simulator.Engine.Tests/Simulator.Engine.Tests.csproj
        dotnet restore Tests/Simulator.Tests/Simulator.Tests.csproj
        dotnet restore Tests/Creator.Engine.Tests/Creator.Engine.Tests.csproj
        dotnet restore Tests/App.Headless.Tests/App.Headless.Tests.csproj
        dotnet restore Apps/Simulator/Simulator.csproj
        dotnet restore Apps/Creator/Creator.csproj
      working-directory: ./src

    - name: Build portable projects and Avalonia apps
      run: |
        dotnet build --configuration Release --no-restore Tests/Core.Tests/Core.Tests.csproj
        dotnet build --configuration Release --no-restore Tests/Shared.Tests/Shared.Tests.csproj
        dotnet build --configuration Release --no-restore Tests/Storage.Tests/Storage.Tests.csproj
        dotnet build --configuration Release --no-restore Tests/Simulator.Engine.Tests/Simulator.Engine.Tests.csproj
        dotnet build --configuration Release --no-restore Tests/Simulator.Tests/Simulator.Tests.csproj
        dotnet build --configuration Release --no-restore Tests/Creator.Engine.Tests/Creator.Engine.Tests.csproj
        dotnet build --configuration Release --no-restore Tests/App.Headless.Tests/App.Headless.Tests.csproj
        dotnet build --configuration Release --no-restore Apps/Simulator/Simulator.csproj
        dotnet build --configuration Release --no-restore Apps/Creator/Creator.csproj
      working-directory: ./src

    - name: Run portable and headless tests
      run: |
        dotnet test --configuration Release --no-build Tests/Core.Tests/Core.Tests.csproj /p:CollectCoverage=true
        dotnet test --configuration Release --no-build Tests/Shared.Tests/Shared.Tests.csproj /p:CollectCoverage=true
        dotnet test --configuration Release --no-build Tests/Storage.Tests/Storage.Tests.csproj /p:CollectCoverage=true
        dotnet test --configuration Release --no-build Tests/Simulator.Engine.Tests/Simulator.Engine.Tests.csproj /p:CollectCoverage=true
        dotnet test --configuration Release --no-build Tests/Simulator.Tests/Simulator.Tests.csproj /p:CollectCoverage=true
        dotnet test --configuration Release --no-build Tests/Creator.Engine.Tests/Creator.Engine.Tests.csproj /p:CollectCoverage=true
        dotnet test --configuration Release --no-build Tests/App.Headless.Tests/App.Headless.Tests.csproj /p:CollectCoverage=true
      working-directory: ./src
