name: Publish Windows installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-installer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Compute installer version and tag
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          if ($env:EVENT_NAME -eq 'release') {
            $tagName = $env:RELEASE_TAG
            if ([string]::IsNullOrWhiteSpace($tagName)) { throw "release event missing tag name" }
            $installer = $tagName.TrimStart('v')
            "Computed installer version from release tag: $installer"
          } else {
            $path = "src/Apps/Simulator/Simulator.csproj"
            $node = Select-Xml -Path $path -XPath "//Project/PropertyGroup/Version" | Select-Object -First 1
            if (-not $node) { throw "$path must define <Version> in a PropertyGroup" }
            $base = $node.Node.InnerText.Trim()
            if ([string]::IsNullOrWhiteSpace($base)) { throw "$path <Version> is empty" }
            $installer = $base
            $tagName = "v$installer"
            "Computed installer version: $installer (tag: $tagName)"
          }
          "installer_version=$installer" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag_name }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish Simulator (win-x64, self-contained)
        run: >
          dotnet publish src/Apps/Simulator/Simulator.csproj
          -c Release -r win-x64 --self-contained true
          -o build/installer/staging/Simulator

      - name: Publish Creator (win-x64, self-contained)
        run: >
          dotnet publish src/Apps/Creator/Creator.csproj
          -c Release -r win-x64 --self-contained true
          -o build/installer/staging/Creator

      - name: Stage samples
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/installer/staging/Samples | Out-Null
          Copy-Item -Path samples/* -Destination build/installer/staging/Samples -Recurse -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.installer_version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $iss = Join-Path $PWD "installer\OpenExamSuite.iss"
          & $iscc "/DMyAppVersion=$env:INSTALLER_VERSION" $iss

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || steps.version.outputs.tag_name }}
          files: installer/Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
